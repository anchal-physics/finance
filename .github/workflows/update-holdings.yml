name: Update effective holdings

# Manual only — private repo, paid minutes. Click "Run workflow" in the Actions tab.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (compute + log, do NOT write to the sheet)"
        type: boolean
        default: false
      sheets:
        description: "Comma-separated Portfolio sheet names to update"
        type: string
        default: "Portfolio_AG,Portfolio_AA"

permissions:
  contents: read          # workflow writes to Google, not to the repo

concurrency:
  group: update-holdings  # never let two writers run at once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10    # hard cap on billable time
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (with pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service-account key from secret
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.SERVICE_ACCOUNT_KEY }}
        run: printf '%s' "$SERVICE_ACCOUNT_KEY" > service_account.json

      - name: Update look-through holdings on the Google Sheet
        env:
          FINANCE_SHEET_ID: ${{ secrets.FINANCE_SHEET_ID }}
          GSPREAD_SA_FILE: service_account.json
          EFF_SHEETS: ${{ inputs.sheets }}
        run: |
          FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAG="--dry-run"; fi
          python update_effective_holdings.py --online $FLAG

      - name: Remove key
        if: always()
        run: rm -f service_account.json
